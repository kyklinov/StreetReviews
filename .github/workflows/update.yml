# CarX Street — ежедневное обновление дэшборда отзывов Steam
# Версия: 1.0 (2026-10-01)
name: Обновление отзывов Steam

on:
  schedule:
    - cron: "17 3 * * *"   # каждый день в 03:17 UTC (06:17 МСК)
  workflow_dispatch:        # ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сбор отзывов
        run: python scripts/fetch_reviews.py

      - name: Коммит data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "data: обновление отзывов $(date -u +'%Y-%m-%d')"
            git push
          fi
