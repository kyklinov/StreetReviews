# Ежедневное обновление дэшборда отзывов CarX
name: Обновление отзывов Steam

on:
  schedule:
    - cron: "17 3 2-31 * *" # ежедневное обновление в 06:17 МСК
    - cron: "17 3 1 * *"    # полная сверка Steam первого числа
  workflow_dispatch:
    inputs:
      steam_mode:
        description: Режим сбора отзывов Steam
        type: choice
        default: recent
        options:
          - recent
          - full

permissions:
  contents: write
  pages: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      STEAM_CACHE_KEY: steam-reviews-v1-${{ github.run_id }}-${{ github.run_attempt }}
      STEAM_REVIEW_MODE: ${{ (github.event.schedule == '17 3 1 * *' || inputs.steam_mode == 'full') && 'full' || 'recent' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Восстановление архива Steam
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .steam-review-cache
          key: ${{ env.STEAM_CACHE_KEY }}
          restore-keys: steam-reviews-v1-

      - name: Сбор оценок мобильных игр — App Store, Google Play и RuStore
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_mobile.py

      - name: Сбор оценок CarX Drift Racing 2 — Huawei AppGallery
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium
          python scripts/fetch_mobile.py --huawei

      - name: Сбор отзывов Steam
        id: steam
        continue-on-error: true
        run: python scripts/fetch_reviews.py

      - name: Сбор оценок и отзывов с консолей
        id: consoles
        continue-on-error: true
        run: python scripts/fetch_consoles.py

      - name: Сбор отзывов VK Play
        id: vkplay
        continue-on-error: true
        run: python scripts/fetch_vkplay.py

      - name: Сбор отзывов Steam — CarX Drift Racing Online 2
        id: steam_dro2
        continue-on-error: true
        env:
          APP_ID: "1826420"
        run: python scripts/fetch_reviews.py

      - name: Сбор оценок PlayStation и отзывов Xbox — CarX Drift Racing Online
        continue-on-error: true
        timeout-minutes: 30
        env:
          REVIEW_PROJECT: drift-racing-online
        run: python scripts/fetch_consoles.py

      - name: Сбор отзывов VK Play — CarX Drift Racing Online
        continue-on-error: true
        timeout-minutes: 10
        env:
          REVIEW_PROJECT: drift-racing-online
        run: python scripts/fetch_vkplay.py

      - name: Сбор отзывов Steam — CarX Drift Racing Online
        id: steam_dro
        continue-on-error: true
        timeout-minutes: 120
        env:
          APP_ID: "635260"
        run: |
          expected=docs/projects/drift-racing-online/data.json
          actual=$(PYTHONPATH=scripts python -c 'import os; from fetch_reviews import OUT_PATH; print(os.path.relpath(OUT_PATH))')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Сборщик Steam пишет в $actual вместо $expected. Обновите scripts/fetch_reviews.py."
            exit 1
          fi
          python scripts/fetch_reviews.py
          if [ ! -s "$expected" ] || [ ! -s "docs/projects/drift-racing-online/reviews/index.json" ]; then
            echo "::error::Сборщик Steam не создал данные CarX Drift Racing Online."
            exit 1
          fi

      - name: Коммит данных
        id: commit_data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A docs/consoles docs/vkplay
          if [ "${{ steps.steam.outcome }}" = "success" ]; then
            git add -A docs/data.json docs/reviews
          fi
          for project in street-mobile drift-racing-3 drift-racing-2 rally-mobile; do
            mobile_dir="docs/projects/$project"
            if [ -d "$mobile_dir" ]; then
              git add -A "$mobile_dir"
            fi
          done
          if [ "${{ steps.steam_dro2.outcome }}" = "success" ]; then
            git add -A docs/projects/drift-racing-online-2
          fi
          dro_dir=docs/projects/drift-racing-online
          for store in consoles vkplay; do
            if [ -d "$dro_dir/$store" ]; then
              git add -A "$dro_dir/$store"
            fi
          done
          if [ "${{ steps.steam_dro.outcome }}" = "success" ]; then
            git add -A "$dro_dir/data.json" "$dro_dir/reviews"
          fi
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "data: обновление отзывов $(date -u +'%Y-%m-%d')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранение архива Steam
        if: steps.commit_data.outcome == 'success' && (steps.steam.outcome == 'success' || steps.steam_dro.outcome == 'success' || steps.steam_dro2.outcome == 'success')
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .steam-review-cache
          key: ${{ env.STEAM_CACHE_KEY }}

      - name: Запрос публикации GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.commit_data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Коммит, отправленный с GITHUB_TOKEN, сам по себе не запускает сборку Pages.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      - name: Проверка
        if: always()
        run: |
          failed=0
          if [ "${{ steps.steam.outcome }}" != "success" ]; then
            echo "::error::Сбор отзывов Steam завершился с ошибкой — на сайте остались прошлые данные Steam. Откройте шаг «Сбор отзывов Steam»."
            failed=1
          fi
          if [ "${{ steps.steam_dro2.outcome }}" != "success" ]; then
            echo "::error::Сбор отзывов Steam для CarX Drift Racing Online 2 завершился с ошибкой."
            failed=1
          fi
          if [ "${{ steps.steam_dro.outcome }}" != "success" ]; then
            echo "::error::Сбор отзывов Steam для CarX Drift Racing Online завершился с ошибкой."
            failed=1
          fi
          if [ "${{ steps.consoles.outcome }}" != "success" ]; then
            echo "::warning::Сбор консолей завершился с ошибкой — подробности в шаге «Сбор оценок и отзывов с консолей»."
          fi
          if [ "${{ steps.vkplay.outcome }}" != "success" ]; then
            echo "::warning::Сбор VK Play завершился с ошибкой — подробности в шаге «Сбор отзывов VK Play»."
          fi
          exit "$failed"
